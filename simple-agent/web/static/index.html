<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E">

<!-- Markdown + 代码高亮：优先 CDN；失败时走本地降级（纯文本 + 换行保留） -->
<script>
  // 兜底：如果 CDN 加载失败，提供最小 marked/hljs 替身，避免页面白屏或 JS 报错
  window.__CDN_OK__ = true;
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
        onerror="window.__CDN_OK__=false"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css" id="hljs-light">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" id="hljs-dark" disabled>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/highlight.min.js"
        onerror="window.__CDN_OK__=false"></script>
<script>
  // 若 CDN 失败，用极简替身：转义 + 保留换行即可
  if (!window.marked) {
    window.marked = { parse: (t) => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>') };
  }
  if (!window.hljs) {
    window.hljs = { highlightElement: () => {} };
  }
</script>

<style>
/* ================== 主题变量 ================== */
:root {
  --bg:        #f5f7fb;
  --panel:     #ffffff;
  --panel-2:   #f9fafb;
  --border:    #e5e7eb;
  --text:      #111827;
  --text-2:    #6b7280;
  --primary:   #2563eb;
  --primary-h: #1d4ed8;
  --user-bg:   linear-gradient(135deg,#3b82f6,#2563eb);
  --asst-bg:   #ffffff;
  --tool-bg:   #fffbeb;
  --tool-bd:   #f59e0b;
  --code-bg:   #f3f4f6;
  --shadow:    0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
}
[data-theme="dark"] {
  --bg:        #0f1115;
  --panel:     #171a21;
  --panel-2:   #1f232c;
  --border:    #2a2f3a;
  --text:      #e5e7eb;
  --text-2:    #9ca3af;
  --primary:   #60a5fa;
  --primary-h: #3b82f6;
  --user-bg:   linear-gradient(135deg,#3b82f6,#6366f1);
  --asst-bg:   #1f232c;
  --tool-bg:   #1e1a0f;
  --tool-bd:   #b45309;
  --code-bg:   #0f1115;
  --shadow:    0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.2);
}

/* ================== 基础 ================== */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14px/1.6 -apple-system,"PingFang SC",system-ui,"Segoe UI",sans-serif;
  background: var(--bg); color: var(--text);
  /* 用 dvh 适配移动端浏览器地址栏伸缩；老浏览器回退到 100% */
  height: 100dvh;
  display: grid; grid-template-columns: 260px minmax(0, 1fr);
  transition: background .2s;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
.icon-btn {
  background: none; border: 1px solid var(--border); border-radius: 8px;
  width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; transition: .15s; flex-shrink: 0;
}
.icon-btn:hover { background: var(--panel-2); }

/* ================== 侧边栏 ================== */
aside {
  background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  transition: transform .25s;
}
.sidebar-head {
  padding: 14px 16px; display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--border);
}
.logo { font-size: 20px; }
.brand { font-weight: 600; }
.new-chat {
  margin: 12px; padding: 10px 12px; border-radius: 8px; border: 1px dashed var(--border);
  background: var(--panel-2); color: var(--text); cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: 8px;
}
.new-chat:hover { border-color: var(--primary); color: var(--primary); }
.session-list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
.session-item {
  padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--text-2); margin-bottom: 2px;
}
.session-item:hover { background: var(--panel-2); color: var(--text); }
.session-item.active { background: var(--panel-2); color: var(--text); font-weight: 500; }
.session-item .del {
  margin-left: auto; opacity: 0; color: var(--text-2); font-size: 14px;
  width: 20px; height: 20px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center;
}
.session-item:hover .del { opacity: .7; }
.session-item .del:hover { background: var(--border); opacity: 1; }
.sidebar-foot {
  padding: 10px 12px; border-top: 1px solid var(--border);
  display: flex; gap: 6px; align-items: center;
}

/* ================== 主区 ================== */
main {
  display: flex; flex-direction: column;
  min-width: 0; min-height: 0;        /* 关键：让内部子元素的 overflow 生效 */
}
.topbar {
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.topbar h1 { margin: 0; font-size: 15px; font-weight: 600; flex-shrink: 0; }
.sid-chip {
  padding: 2px 8px; font-size: 11px; color: var(--text-2);
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px;
  font-family: ui-monospace, monospace;
  max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.top-spacer { flex: 1; }

/* ================== 对话区 ================== */
#log {
  flex: 1 1 0; min-height: 0;          /* 让它能在 flex 容器中正确滚动 */
  overflow-y: auto; overflow-x: hidden;
  padding: 24px 16px 16px; scroll-behavior: smooth;
}
.msg { max-width: 760px; margin: 0 auto 18px; display: flex; gap: 10px; align-items: flex-start; }
.avatar {
  width: 32px; height: 32px; border-radius: 8px; background: var(--panel-2);
  display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
  border: 1px solid var(--border);
}
.bubble {
  flex: 1 1 auto; min-width: 0;        /* flex 子元素必须 min-width:0 才能正确换行 */
  max-width: calc(100% - 44px);
  padding: 10px 14px; border-radius: 12px;
  background: var(--asst-bg); border: 1px solid var(--border); box-shadow: var(--shadow);
  word-break: break-word; overflow-wrap: anywhere;
}
.bubble .meta { font-size: 11px; color: var(--text-2); margin-top: 6px; display: flex; gap: 8px; align-items: center; }
.bubble .meta .copy {
  cursor: pointer; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border);
  font-size: 11px; background: transparent;
}
.bubble .meta .copy:hover { background: var(--panel-2); color: var(--primary); }
.msg.user { flex-direction: row-reverse; }
.msg.user .bubble {
  background: var(--user-bg); color: #fff; border: 0;
  box-shadow: 0 4px 14px rgba(37,99,235,.28);
}
.msg.user .bubble .meta { color: rgba(255,255,255,.75); }
.msg.user .bubble .meta .copy { color: #fff; border-color: rgba(255,255,255,.35); }

/* markdown 内容 */
.bubble .md :where(p,ul,ol,pre,blockquote):first-child { margin-top: 0; }
.bubble .md :where(p,ul,ol,pre,blockquote):last-child { margin-bottom: 0; }
.bubble .md p { margin: 6px 0; }
.bubble .md code { background: var(--code-bg); padding: 1px 6px; border-radius: 4px; font-size: 13px; }
.bubble .md pre {
  background: var(--code-bg); border-radius: 8px; padding: 10px 12px;
  overflow-x: auto; font-size: 13px;
}
.bubble .md pre code { background: transparent; padding: 0; }
.bubble .md a { color: var(--primary); }
.msg.user .md a { color: #fff; text-decoration: underline; }

/* 思考中闪烁光标 */
.cursor::after {
  content: '▎'; display: inline-block; margin-left: 2px; animation: blink 1s step-end infinite;
  color: var(--primary); font-weight: 600;
}
@keyframes blink { 50% { opacity: 0; } }

/* 工具调用卡片 */
.tool-card {
  max-width: 760px; margin: 0 auto 12px; padding: 8px 12px;
  background: var(--tool-bg); border-left: 3px solid var(--tool-bd); border-radius: 6px;
  font-size: 12px; font-family: ui-monospace, monospace;
}
.tool-card summary {
  cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px;
  color: var(--tool-bd); font-weight: 600;
}
.tool-card summary::-webkit-details-marker { display: none; }
.tool-card summary::before { content: '▶'; font-size: 9px; transition: .15s; }
.tool-card[open] summary::before { transform: rotate(90deg); }
.tool-card .args, .tool-card .result {
  margin-top: 6px; padding: 6px 8px; background: rgba(0,0,0,.04); border-radius: 4px;
  white-space: pre-wrap; word-break: break-all;
}
[data-theme="dark"] .tool-card .args,
[data-theme="dark"] .tool-card .result { background: rgba(255,255,255,.05); }
.tool-card .label { color: var(--text-2); font-size: 11px; }

/* ================== 底部输入 ================== */
.composer {
  padding: 12px 16px 16px; background: var(--panel); border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.composer-inner {
  max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 14px;
  padding: 6px 6px 6px 12px; box-shadow: var(--shadow);
}
.composer-inner:focus-within { border-color: var(--primary); }
textarea {
  flex: 1 1 auto; min-width: 0;
  resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
  font: inherit; padding: 8px 0; min-height: 24px; max-height: 180px; line-height: 1.5;
}
.send-btn {
  width: 36px; height: 36px; border-radius: 10px; border: 0; cursor: pointer;
  background: var(--primary); color: #fff; display: inline-flex; align-items: center; justify-content: center;
  transition: .15s;
}
.send-btn:hover { background: var(--primary-h); }
.send-btn:disabled { background: var(--text-2); cursor: not-allowed; opacity: .6; }
.composer-hint {
  max-width: 780px; margin: 8px auto 0; font-size: 11px; color: var(--text-2); text-align: center;
}

/* 推荐问题 */
.chips {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  max-width: 780px; margin: 20px auto;
}
.chip {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px;
  background: var(--panel); cursor: pointer; font-size: 13px; color: var(--text-2);
  transition: .15s;
}
.chip:hover { border-color: var(--primary); color: var(--primary); }

/* 空状态 */
.empty {
  max-width: 560px; margin: 60px auto 0; text-align: center; color: var(--text-2);
}
.empty .big { font-size: 48px; margin-bottom: 12px; }
.empty h2 { color: var(--text); margin: 0 0 6px; font-size: 20px; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--text); color: var(--panel); padding: 8px 14px; border-radius: 8px;
  font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 100;
}
.toast.show { opacity: .92; }

/* 响应式 */
.menu-btn { display: none; }
.collapse-btn { display: inline-flex; }   /* 桌面默认显示折叠按钮 */
.backdrop { display: none; }              /* 默认隐藏，只在小屏由 .show 控制显示 */

/* 中等屏幕：稍微缩窄侧边栏 */
@media (max-width: 1024px) {
  body { grid-template-columns: 220px minmax(0, 1fr); }
}

/* 桌面端手动折叠侧边栏：只剩主区 */
body.sidebar-collapsed { grid-template-columns: 0 minmax(0, 1fr); }
body.sidebar-collapsed aside {
  width: 0; min-width: 0; overflow: hidden; border-right: 0;
}

/* 小屏：侧边栏变抽屉（断点收紧到 768px，桌面浏览半屏不会触发） */
@media (max-width: 768px) {
  body, body.sidebar-collapsed { grid-template-columns: minmax(0, 1fr); }
  aside {
    position: fixed; inset: 0 auto 0 0; width: 260px; min-width: 260px; z-index: 50;
    transform: translateX(-100%); box-shadow: var(--shadow);
    border-right: 1px solid var(--border); overflow: visible;
  }
  aside.open { transform: translateX(0); }
  .menu-btn { display: inline-flex; }
  .collapse-btn { display: none; }
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: none;
  }
  .backdrop.show { display: block; }
  .topbar { padding: 10px 12px; }
  .sid-chip { max-width: 120px; }
  .composer { padding: 8px 10px 12px; }
  #log { padding: 16px 10px 12px; }
  .msg { margin-bottom: 12px; }
}
/* iOS safari 底部安全区 */
@supports (padding: env(safe-area-inset-bottom)) {
  .composer { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>

<!-- ========================== 侧边栏 ========================== -->
<aside id="sidebar">
  <div class="sidebar-head">
    <span class="logo">🤖</span>
    <span class="brand">Simple Agent</span>
  </div>
  <button class="new-chat" id="newChatBtn">➕ 新建会话</button>
  <div class="session-list" id="sessionList"></div>
  <div class="sidebar-foot">
    <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
    <button class="icon-btn" id="exportBtn" title="导出当前会话 JSON">⬇</button>
    <div style="flex:1"></div>
    <span style="font-size:11px;color:var(--text-2)" id="healthChip">·</span>
  </div>
</aside>
<div class="backdrop" id="backdrop"></div>

<!-- ========================== 主区 ========================== -->
<main>
  <div class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" title="菜单">☰</button>
    <button class="icon-btn collapse-btn" id="collapseBtn" title="折叠/展开侧边栏">☰</button>
    <h1>对话</h1>
    <span class="sid-chip" id="sidChip">session: -</span>
    <div class="top-spacer"></div>
    <button class="icon-btn" id="clearBtn" title="清空当前对话视图">🧹</button>
  </div>

  <div id="log"></div>

  <div class="composer">
    <div class="composer-inner">
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="send-btn" id="sendBtn" title="发送 (Enter)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="composer-hint">模型可能会犯错，请核对重要信息</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ============================================
 * 全局状态
 * ============================================ */
const $ = id => document.getElementById(id);
const logEl     = $('log');
const input     = $('input');
const sendBtn   = $('sendBtn');
const sidChip   = $('sidChip');
const sessionList = $('sessionList');
const toast     = $('toast');

let sessionId  = localStorage.getItem('sessionId') || null;
let isSending  = false;
let currentAssistant = null;       // 当前正在流式写入的气泡 .md 元素
const SUGGESTIONS = [
  '现在几点了？',
  '帮我算一下 (12+8)*5/4',
  '北京天气怎么样？',
  '介绍下你自己',
];

// marked 5+ 的 highlight 选项已废弃，改为渲染后再用 hljs.highlightElement 处理
marked.setOptions({ breaks: true, gfm: true });

/* ============================================
 * 主题
 * ============================================ */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
  $('hljs-light').disabled = (t === 'dark');
  $('hljs-dark').disabled  = (t !== 'dark');
  localStorage.setItem('theme', t);
}
applyTheme(localStorage.getItem('theme') || 'light');
$('themeBtn').onclick = () => applyTheme(
  document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
);

/* ============================================
 * Toast
 * ============================================ */
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

/* ============================================
 * 对话渲染
 * ============================================ */
function timeStr() {
  const d = new Date();
  return d.toTimeString().slice(0, 5);
}

function scrollToBottom(force=false) {
  const nearBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80;
  if (force || nearBottom) logEl.scrollTop = logEl.scrollHeight;
}

function createMsg(role, text='', {streaming=false}={}) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  wrap.innerHTML = `
    <div class="avatar">${role === 'user' ? '🧑' : '🤖'}</div>
    <div class="bubble">
      <div class="md"></div>
      <div class="meta">
        <span>${timeStr()}</span>
        <button class="copy" title="复制">复制</button>
      </div>
    </div>`;
  const md = wrap.querySelector('.md');
  if (streaming) md.classList.add('cursor');
  if (text) renderInto(md, text);

  const copyBtn = wrap.querySelector('.copy');
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(md.dataset.raw || md.textContent).then(
      () => showToast('已复制'),
      () => showToast('复制失败')
    );
  };

  logEl.appendChild(wrap);
  scrollToBottom(true);
  return md;
}

function renderInto(md, text) {
  md.dataset.raw = text;
  md.innerHTML = marked.parse(text);
  md.querySelectorAll('pre code').forEach(el => {
    try { hljs.highlightElement(el); } catch {}
  });
}

function appendTool(ev) {
  const card = document.createElement('details');
  card.open = true;
  card.className = 'tool-card';
  card.innerHTML = `
    <summary>🔧 ${escapeHTML(ev.name)} <span class="label" style="font-weight:400;margin-left:6px">等待结果…</span></summary>
    <div class="args"><span class="label">args</span><br>${escapeHTML(JSON.stringify(ev.arguments ?? {}))}</div>
    <div class="result" style="display:none"></div>`;
  logEl.appendChild(card);
  scrollToBottom();
  return card;
}
function fillToolResult(card, content) {
  card.querySelector('.label').textContent = '已完成';
  card.querySelector('summary .label').textContent = '完成';
  const r = card.querySelector('.result');
  r.style.display = '';
  r.innerHTML = `<span class="label">result</span><br>${escapeHTML(content)}`;
  card.open = false;  // 默认折叠结果，保持干净
}
function escapeHTML(s) {
  const AMP = String.fromCharCode(38) + 'amp;';
  const LT  = String.fromCharCode(38) + 'lt;';
  const GT  = String.fromCharCode(38) + 'gt;';
  return String(s == null ? '' : s)
    .replace(/&/g, AMP).replace(/</g, LT).replace(/>/g, GT);
}

/* ============================================
 * 空状态 & 推荐问题
 * ============================================ */
function renderEmpty() {
  logEl.innerHTML = `
    <div class="empty">
      <div class="big">🤖</div>
      <h2>Simple Agent</h2>
      <p>我可以帮你查时间、做计算、查天气，试试这些：</p>
    </div>
    <div class="chips" id="chips"></div>`;
  const chips = $('chips');
  SUGGESTIONS.forEach(q => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = q;
    b.onclick = () => { input.value = q; input.focus(); autoGrow(); };
    chips.appendChild(b);
  });
}

/* ============================================
 * 会话列表
 * ============================================ */
async function refreshSessions() {
  try {
    const res = await fetch('/api/sessions');
    const list = await res.json();
    sessionList.innerHTML = '';
    if (!list.length) {
      sessionList.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-2);font-size:12px">暂无会话</div>`;
      return;
    }
    list.forEach(s => {
      const row = document.createElement('div');
      row.className = 'session-item' + (s.session_id === sessionId ? ' active' : '');
      row.innerHTML = `
        <span>💬</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHTML(s.session_id)}</span>
        <span class="del" title="删除">✕</span>`;
      row.onclick = (e) => {
        if (e.target.classList.contains('del')) {
          deleteSession(s.session_id); return;
        }
        switchSession(s.session_id);
      };
      sessionList.appendChild(row);
    });
  } catch (e) {
    console.error(e);
  }
}

async function deleteSession(sid) {
  if (!confirm(`删除会话 ${sid}？`)) return;
  await fetch('/api/sessions/' + encodeURIComponent(sid), { method: 'DELETE' });
  if (sid === sessionId) switchSession(null);
  else refreshSessions();
  showToast('已删除');
}

function switchSession(sid) {
  sessionId = sid;
  if (sid) localStorage.setItem('sessionId', sid);
  else localStorage.removeItem('sessionId');
  sidChip.textContent = 'session: ' + (sid || '-');
  renderEmpty();
  refreshSessions();
  // 手机端自动关抽屉
  $('sidebar').classList.remove('open');
  $('backdrop').classList.remove('show');
}

$('newChatBtn').onclick = () => switchSession(null);
$('clearBtn').onclick = renderEmpty;

/* ============================================
 * 导出
 * ============================================ */
$('exportBtn').onclick = () => {
  if (!sessionId) return showToast('当前无会话');
  const a = document.createElement('a');
  a.href = `/api/sessions`; // 简单：服务器列表；后面可扩展导出历史
  showToast('进阶：可扩展按 session 导出 JSON');
};

/* ============================================
 * 健康检查
 * ============================================ */
fetch('/api/health').then(r => r.json()).then(h => {
  $('healthChip').textContent = h.long_term_enabled ? '长期记忆·ON' : '长期记忆·OFF';
}).catch(() => $('healthChip').textContent = 'offline');

/* ============================================
 * 输入框自适应
 * ============================================ */
function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
}
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
sendBtn.onclick = send;

/* ============================================
 * 发送消息（SSE 流式）
 * ============================================ */
async function send() {
  const text = input.value.trim();
  if (!text || isSending) return;

  // 如果还是空状态，清掉欢迎区
  if (logEl.querySelector('.empty')) logEl.innerHTML = '';

  input.value = ''; autoGrow();
  isSending = true; sendBtn.disabled = true;

  createMsg('user', text);
  const asstMd = createMsg('assistant', '', { streaming: true });
  currentAssistant = asstMd;
  let asstBuffer = '';
  let currentToolCard = null;

  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const line = raw.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }
        handleEvent(ev);
      }
    }

    asstMd.classList.remove('cursor');
    refreshSessions();

    function handleEvent(ev) {
      if (ev.type === 'session') {
        sessionId = ev.session_id;
        localStorage.setItem('sessionId', sessionId);
        sidChip.textContent = 'session: ' + sessionId;
      }
      else if (ev.type === 'tool_call') {
        currentToolCard = appendTool(ev);
      }
      else if (ev.type === 'tool_result') {
        if (currentToolCard) { fillToolResult(currentToolCard, ev.content); currentToolCard = null; }
        else appendTool({ name: ev.name, arguments: {} }).querySelector('.result').textContent = ev.content;
        scrollToBottom();
      }
      else if (ev.type === 'final') {
        typeInto(asstMd, ev.content || '');
      }
      else if (ev.type === 'done') {
        if (!asstBuffer && ev.answer) typeInto(asstMd, ev.answer);
      }
    }

    function typeInto(md, full) {
      // 简易打字机：每帧追加若干字符，直到完成
      let i = 0;
      const step = () => {
        if (i >= full.length) { renderInto(md, full); return; }
        i = Math.min(full.length, i + Math.max(2, Math.floor(full.length / 60)));
        asstBuffer = full.slice(0, i);
        renderInto(md, asstBuffer);
        scrollToBottom();
        if (i < full.length) requestAnimationFrame(step);
      };
      step();
    }
  } catch (err) {
    renderInto(asstMd, `❌ 出错：${err.message}`);
    asstMd.classList.remove('cursor');
    showToast('请求失败');
  } finally {
    isSending = false; sendBtn.disabled = false; input.focus();
  }
}

/* ============================================
 * 移动端菜单
 * ============================================ */
$('menuBtn').onclick = () => {
  $('sidebar').classList.toggle('open');
  $('backdrop').classList.toggle('show');
};
$('backdrop').onclick = () => {
  $('sidebar').classList.remove('open');
  $('backdrop').classList.remove('show');
};

/* 桌面端：折叠/展开侧边栏（记忆到 localStorage） */
(function(){
  if (localStorage.getItem('sidebarCollapsed') === '1') {
    document.body.classList.add('sidebar-collapsed');
  }
  $('collapseBtn').onclick = () => {
    const collapsed = document.body.classList.toggle('sidebar-collapsed');
    localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0');
  };
})();

/* ============================================
 * 初始化
 * ============================================ */
if (sessionId) sidChip.textContent = 'session: ' + sessionId;
renderEmpty();
refreshSessions();
input.focus();
</script>
